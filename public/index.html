<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Concert Lights</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0f;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.25s ease;
    position: relative;
    background: #0a0a0f;
  }

  /* Strobe overlay */
  #strobe {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
  }

  /* Pulse animation */
  @keyframes pulse-anim {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Fade animation */
  @keyframes fade-anim {
    0% { opacity: 1; }
    50% { opacity: 0.1; }
    100% { opacity: 1; }
  }

  .effect-pulse { animation: pulse-anim 1.2s ease-in-out infinite; }
  .effect-fade  { animation: fade-anim 3s ease-in-out infinite; }

  /* Strobe flicker */
  @keyframes strobe-anim {
    0%, 49% { opacity: 0; }
    50%, 100% { opacity: 0.85; }
  }
  .strobe-on { animation: strobe-anim 0.15s steps(1) infinite; }

  /* Waiting state */
  #waiting {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    padding: 40px;
  }

  .waiting-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: rgba(255,255,255,0.5);
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .waiting-text {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  /* Connection UI */
  #connect-ui {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 20px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.3s ease;
  }

  #connect-ui.hidden { transform: translateY(100%); }

  .ui-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  .url-row {
    display: flex;
    gap: 10px;
  }

  .url-row input {
    flex: 1;
    padding: 10px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    outline: none;
  }

  .url-row input::placeholder { color: rgba(255,255,255,0.2); }

  .connect-btn {
    padding: 10px 20px;
    background: #7c6aff;
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .connect-btn:hover { opacity: 0.85; }

  /* Status bar */
  #status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }

  .status-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    padding: 6px 12px;
    border-radius: 999px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.3s;
  }

  .status-dot.live { background: #4ade80; box-shadow: 0 0 6px #4ade8080; }

  /* Toggle UI button */
  #toggle-ui-btn {
    pointer-events: all;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    color: rgba(255,255,255,0.35);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  #toggle-ui-btn:hover { color: rgba(255,255,255,0.7); }

  /* Tap to fullscreen hint */
  #fullscreen-hint {
    position: fixed;
    bottom: 80px; left: 50%; transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 1s;
  }

  /* Demo mode label */
  #demo-label {
    position: fixed;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    text-align: center;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="strobe"></div>
  <div id="waiting">
    <div class="waiting-ring"></div>
    <div class="waiting-text">Esperando señal del DJ…</div>
  </div>
</div>

<div id="demo-label">MODO DEMO · MISMA PESTAÑA</div>

<div id="status-bar">
  <div class="status-info">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-label">sin señal</span>
  </div>
  <button id="toggle-ui-btn" onclick="toggleUI()">ajustes</button>
</div>

<div id="fullscreen-hint">Toca para pantalla completa</div>

<div id="connect-ui">
  <div class="ui-label">Servidor WebSocket (opcional)</div>
  <div class="url-row">
    <input type="text" id="ws-url" value="ws://localhost:3001" placeholder="ws://servidor:3001">
    <button class="connect-btn" id="conn-btn" onclick="toggleConnect()">Conectar</button>
  </div>
  <div style="font-size: 12px; color: rgba(255,255,255,0.25); font-family: 'Space Mono', monospace;">
    Demo local: abre controlador.html en la misma computadora
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const strobe = document.getElementById('strobe');
const waiting = document.getElementById('waiting');
const statusDot = document.getElementById('status-dot');
const statusLabel = document.getElementById('status-label');
const demoLabel = document.getElementById('demo-label');

let currentColor = '#0a0a0f';
let ws = null;
let uiVisible = true;

// --- BroadcastChannel demo (same computer) ---
const channel = new BroadcastChannel('concert_lights');
channel.onmessage = (e) => { applyCommand(e.data); };

// Auto-detect URL
function getAutoWsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}`;
}

const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (!isLocal) {
  document.getElementById('ws-url').value = getAutoWsUrl();
  document.querySelector('.connect-btn').textContent = 'Conectando…';
  setTimeout(() => toggleConnect(), 600);
}

// --- WebSocket connection ---
function toggleConnect() {
  const url = document.getElementById('ws-url').value;
  const btn = document.getElementById('conn-btn');
  if (ws) {
    ws.close(); ws = null;
    btn.textContent = 'Conectar';
    setStatus(false, 'desconectado');
    return;
  }
  ws = new WebSocket(url);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'audience_hello', id: generateId() }));
    btn.textContent = 'Desconectar';
    setStatus(true, 'conectado');
    demoLabel.style.opacity = '0';
  };
  ws.onmessage = (e) => {
    try { applyCommand(JSON.parse(e.data)); } catch(err) {}
  };
  ws.onerror = () => setStatus(false, 'error');
  ws.onclose = () => { ws = null; btn.textContent = 'Conectar'; setStatus(false, 'sin señal'); };
}

function applyCommand(cmd) {
  if (cmd.type !== 'color_command') return;

  const { color, brightness = 1, effect = 'solid' } = cmd;

  // Adjust brightness by mixing with black
  const r = parseInt(color.slice(1,3),16);
  const g = parseInt(color.slice(3,5),16);
  const b = parseInt(color.slice(5,7),16);
  const rf = Math.round(r * brightness).toString(16).padStart(2,'0');
  const gf = Math.round(g * brightness).toString(16).padStart(2,'0');
  const bf = Math.round(b * brightness).toString(16).padStart(2,'0');
  const finalColor = `#${rf}${gf}${bf}`;

  // Clear previous animations
  stage.style.animation = '';
  stage.classList.remove('effect-pulse', 'effect-fade');
  strobe.classList.remove('strobe-on');
  strobe.style.animation = '';

  stage.style.backgroundColor = finalColor;
  waiting.style.display = 'none';
  currentColor = finalColor;

  // Apply effect
  switch(effect) {
    case 'pulse':
      stage.classList.add('effect-pulse');
      break;
    case 'strobe':
      strobe.classList.add('strobe-on');
      break;
    case 'fade':
      stage.classList.add('effect-fade');
      break;
    // solid: nothing extra
  }

  setStatus(true, `live · ${color}`);
  demoLabel.style.opacity = '0';

  // Hide UI on first command
  if (uiVisible) {
    document.getElementById('connect-ui').classList.add('hidden');
    document.getElementById('fullscreen-hint').style.opacity = '0';
    uiVisible = false;
  }
}

function setStatus(active, text) {
  statusDot.classList.toggle('live', active);
  statusLabel.textContent = text;
}

function toggleUI() {
  const ui = document.getElementById('connect-ui');
  uiVisible = !uiVisible;
  ui.classList.toggle('hidden', !uiVisible);
}

// Fullscreen on tap
stage.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else stage.requestFullscreen?.();
  document.getElementById('fullscreen-hint').style.opacity = '0';
});

function generateId() {
  return 'celular_' + Math.random().toString(36).substr(2, 8);
}

// Auto-hide hint
setTimeout(() => {
  document.getElementById('fullscreen-hint').style.opacity = '0';
}, 5000);
</script>
</body>
</html>
