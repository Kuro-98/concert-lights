<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Concert Lights</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0f;
  }

  /* ── Pantalla principal ──────────────────────────────────────── */
  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.25s ease;
    position: relative;
    background: #0a0a0f;
  }

  /* Strobe overlay */
  #strobe {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
  }

  /* ── Efectos ─────────────────────────────────────────────────── */
  @keyframes pulse-anim {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
  @keyframes fade-anim {
    0%        { opacity: 1; }
    50%       { opacity: 0.1; }
    100%      { opacity: 1; }
  }
  @keyframes strobe-anim {
    0%,  49% { opacity: 0; }
    50%, 100% { opacity: 0.85; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .effect-pulse  { animation: pulse-anim  1.2s ease-in-out infinite; }
  .effect-fade   { animation: fade-anim   3s   ease-in-out infinite; }
  .strobe-on     { animation: strobe-anim 0.15s steps(1)  infinite; }

  /* ── Pantalla de espera ──────────────────────────────────────── */
  #waiting {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  /*
   * ════════════════════════════════════════════════════════
   *  LOGO DE MARCA — PANTALLA DE ESPERA
   *  Cambia la propiedad src del <img id="brand-logo">
   *  en el HTML de abajo, o usa background-image aquí.
   *
   *  Ejemplo con background-image:
   *    #brand-logo-bg { background-image: url('logo.png'); }
   *
   *  Tamaño por defecto: 200px de ancho, centrado.
   *  Ajusta max-width para hacerlo más grande o pequeño.
   * ════════════════════════════════════════════════════════
   */
  #brand-logo-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 48px;
    /* Opacidad del logo durante la espera — bájala si quieres más sutil */
    opacity: 0.85;
    transition: opacity 1s ease;
  }

  #brand-logo {
    /* ← CAMBIA ESTE VALOR para ajustar el tamaño del logo */
    max-width: 200px;
    width: 60%;
    height: auto;
    object-fit: contain;
    display: block;
    /* Si no hay imagen, el espacio queda reservado igualmente */
  }

  /* Placeholder visible cuando no hay imagen asignada */
  #brand-logo.empty {
    min-height: 80px;
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Spinner de espera */
  .waiting-ring {
    width: 48px; height: 48px;
    border: 2px solid rgba(255,255,255,0.08);
    border-top-color: rgba(255,255,255,0.4);
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
    margin-bottom: 14px;
  }

  .waiting-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
  }

  /* ── Status bar (top) ────────────────────────────────────────── */
  #status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .status-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    padding: 5px 12px;
    border-radius: 999px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.3s;
  }
  .status-dot.live { background: #4ade80; box-shadow: 0 0 6px #4ade8080; }
</style>
</head>
<body>

<div id="stage">
  <div id="strobe"></div>

  <!-- Pantalla de espera con logo -->
  <div id="waiting">

    <!-- ╔══════════════════════════════════════════════════╗
         ║  LOGO DE MARCA                                   ║
         ║  Cambia el atributo src por la ruta de tu logo  ║
         ║  Ejemplo: src="logo.png"  o  src="img/logo.svg" ║
         ╚══════════════════════════════════════════════════╝ -->
    <div id="brand-logo-wrap">
      <img
        id="brand-logo"
        src="logo.png"
        alt="Logo"
        onerror="this.style.display='none'"
      />
    </div>
    <!-- ══════════════════════════════════════════════════ -->

    <div class="waiting-ring"></div>
    <div class="waiting-text">Esperando señal del DJ…</div>
  </div>
</div>

<!-- Status: solo visible para el DJ o en debug -->
<div id="status-bar">
  <div class="status-info">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-label">conectando…</span>
  </div>
</div>

<script>
const stage   = document.getElementById('stage');
const strobe  = document.getElementById('strobe');
const waiting = document.getElementById('waiting');
const statusDot   = document.getElementById('status-dot');
const statusLabel = document.getElementById('status-label');

let ws = null;

// ── BroadcastChannel para pruebas locales (misma máquina) ──────────────────
const channel = new BroadcastChannel('concert_lights');
channel.onmessage = (e) => applyCommand(e.data);

// ── Conexión automática al servidor ────────────────────────────────────────
function getWsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}`;
}

function connect() {
  // Solo conectar si estamos en un servidor real (no al abrir el HTML directamente)
  if (location.protocol === 'file:') return;

  ws = new WebSocket(getWsUrl());

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'audience_hello', id: generateId() }));
    setStatus(true, 'en vivo');
  };

  ws.onmessage = (e) => {
    try { applyCommand(JSON.parse(e.data)); } catch {}
  };

  ws.onerror = () => setStatus(false, 'error');

  ws.onclose = () => {
    setStatus(false, 'reconectando…');
    setTimeout(connect, 3000); // Reconexión automática
  };
}

connect();

// ── Aplicar comando de color ───────────────────────────────────────────────
function applyCommand(cmd) {
  if (cmd.type !== 'color_command') return;

  const { color, brightness = 1, effect = 'solid' } = cmd;

  // Calcular color con brillo
  const r = parseInt(color.slice(1,3), 16);
  const g = parseInt(color.slice(3,5), 16);
  const b = parseInt(color.slice(5,7), 16);
  const rf = Math.round(r * brightness).toString(16).padStart(2,'0');
  const gf = Math.round(g * brightness).toString(16).padStart(2,'0');
  const bf = Math.round(b * brightness).toString(16).padStart(2,'0');
  const finalColor = `#${rf}${gf}${bf}`;

  // Limpiar efectos anteriores
  stage.classList.remove('effect-pulse', 'effect-fade');
  strobe.classList.remove('strobe-on');

  // Aplicar color
  stage.style.backgroundColor = finalColor;

  // Ocultar pantalla de espera (con fade)
  if (waiting.style.opacity !== '0') {
    waiting.style.transition = 'opacity 0.6s ease';
    waiting.style.opacity = '0';
    setTimeout(() => { waiting.style.display = 'none'; }, 600);
  }

  // Aplicar efecto
  switch (effect) {
    case 'pulse':  stage.classList.add('effect-pulse'); break;
    case 'strobe': strobe.classList.add('strobe-on');   break;
    case 'fade':   stage.classList.add('effect-fade');  break;
  }

  setStatus(true, `live · ${color}`);
}

function setStatus(active, text) {
  statusDot.classList.toggle('live', active);
  statusLabel.textContent = text;
}

// Fullscreen al tocar la pantalla
stage.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else stage.requestFullscreen?.();
});

function generateId() {
  return 'celular_' + Math.random().toString(36).substr(2, 8);
}
</script>
</body>
</html>
